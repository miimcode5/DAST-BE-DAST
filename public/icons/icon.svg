<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="dastBg" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#174D35"/>
      <stop offset="100%" stop-color="#26734B"/>
    </linearGradient>
    <g id="reachingHand">
      <!-- Sleeve cuff -->
      <rect x="-188" y="-38" width="44" height="78" rx="11" fill="#78B98A" fill-opacity="0.14" stroke="#F6F7F2" stroke-width="10.5" stroke-linejoin="round"/>
      <!-- Wrist + Thumb smoothly flowing into Index Finger -->
      <path d="M -144 -20 L -118 -20 C -104 -20 -95 -28 -86 -39 L -68 -60 C -61 -68 -48 -66 -43 -57 C -39 -50 -43 -41 -49 -35 L -67 -20 L -36 -20 A 8.5 8.5 0 0 1 -36 -3 L -80 -3" stroke="#F6F7F2" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Middle Finger -->
      <path d="M -80 -3 L -24 -3 A 8.5 8.5 0 0 1 -24 14 L -82 14" stroke="#F6F7F2" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Ring Finger -->
      <path d="M -82 14 L -34 14 A 8.5 8.5 0 0 1 -34 31 L -84 31" stroke="#F6F7F2" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Pinky + Lower Palm + Wrist -->
      <path d="M -84 31 L -50 31 A 8.5 8.5 0 0 1 -50 48 L -102 48 C -118 48 -130 29 -144 29" stroke="#F6F7F2" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Rounded Squircle Background (Site Jihadi Green Gradient) -->
  <rect width="512" height="512" rx="126" fill="url(#dastBg)"/>

  <!-- Two diagonal reaching hands -->
  <g transform="translate(256, 256) scale(0.98)">
    <!-- Top-left hand reaching down-right -->
    <g transform="rotate(45)">
      <use href="#reachingHand"/>
    </g>
    <!-- Bottom-right hand reaching up-left -->
    <g transform="rotate(225)">
      <use href="#reachingHand"/>
      <!-- Accent line + dot along outer cuff -->
      <line x1="-186" y1="56" x2="-158" y2="56" stroke="#E9B949" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-139" cy="56" r="5.2" fill="#E9B949"/>
    </g>
  </g>
</svg>
